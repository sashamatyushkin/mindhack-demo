<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>MindHack</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@200;300;400;600&display=swap">
  <script type="module" crossorigin src="/mindhack-demo/assets/index-DAHYrX1y.js"></script>
  <link rel="stylesheet" crossorigin href="/mindhack-demo/assets/index-LFXEeWmy.css">
</head>
<body>
  <!-- Видно сразу, до загрузки скриптов. Если приложение не поднимется,
       человек увидит это, а не чёрный экран. -->
  <div id="root">
    <div id="boot" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:14px;padding:32px;text-align:center;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#8B9099">
      <div style="width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.12);
        border-top-color:#E0B15C;animation:sp 1s linear infinite"></div>
      <div style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#E0B15C">MindHack</div>
      <div id="boot-msg" style="font-size:13.5px;line-height:1.5;max-width:280px">Загружаем приложение…</div>
    </div>
  </div>
  <style>@keyframes sp{to{transform:rotate(360deg)}}</style>
  <script>
    // Любая ошибка до или во время запуска показывается на экране, а не молча гасит его.
    (function () {
      var shown = false;
      function fail(what, detail) {
        if (shown) return; shown = true;
        var m = document.getElementById('boot-msg');
        if (!m) return;
        m.parentElement.querySelector('div').style.animation = 'none';
        m.innerHTML = '<b style="color:#F1F3F6;display:block;margin-bottom:8px">Не удалось запустить</b>' +
          what + '<br><span style="opacity:.6;font-size:11.5px;word-break:break-word">' +
          String(detail || '').slice(0, 200) + '</span>';
      }
      window.addEventListener('error', function (e) {
        if (e.target && e.target.tagName === 'SCRIPT') fail('Не загрузился файл приложения.', e.target.src);
        else fail('Ошибка в коде приложения.', e.message);
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        fail('Запрос не выполнился.', e.reason && (e.reason.message || e.reason));
      });
      // если через 8 секунд экран так и не сменился — сообщаем честно
      setTimeout(function () {
        if (document.getElementById('boot')) {
          fail('Приложение не ответило за 8 секунд.', 'Проверьте связь и откройте ещё раз.');
        }
      }, 8000);
      window.__bootFail = fail;
    })();
  </script>
</body>
</html>
